version: "3.8"

services:
  backend:
    build:
      context: ./product_backend
      dockerfile: Dockerfile
    
    restart: unless-stopped

    container_name: backend

    ports:
      - "8080:8080"

    environment:
      - MONGO_URI=${MONGO_URI}
      - JWT_SECRET=${JWT_SECRET}
    
    networks:
      - task-manager-network
    
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health | grep UP || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 40s
  
  frontend:
    build:
      context: ./product_frontend
      dockerfile: Dockerfile
    
    restart: unless-stopped

    container_name: frontend

    ports:
      - "3030:80"

    depends_on:
      backend:
        condition: service_healthy
    
    networks:
      - task-manager-network

networks:
  task-manager-network:
    driver: bridge