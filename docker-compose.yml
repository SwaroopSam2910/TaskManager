version: "3.8"

services:
  backend:
    build:
      context: ./product_backend
      dockerfile: Dockerfile

    container_name: backend

    ports:
      - "8080:8080"

    environment:
      - MONGO_URI=${MONGO_URI}
      - JWT_SECRET=${JWT_SECRET}
    
    networks:
      - task-manager-network
  
  frontend:
    build:
      context: ./product_frontend
      dockerfile: Dockerfile

    container_name: frontend

    ports:
      - "3030:80"

    depends_on:
      - backend
    
    networks:
      - task-manager-network

networks:
  task-manager-network:
    driver: bridge