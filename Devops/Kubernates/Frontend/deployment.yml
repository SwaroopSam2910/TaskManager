apiVersion: apps/v1

kind: Deployment

metadata:
  name: frontend-deployment
  namespace: task-manager

spec:
  replicas: 2

  selector:
    matchLabels:
      app: frontend
  
  template:
    metadata:
      labels:
        app: frontend

    spec:
      containers:
      - name: frontend
        image: swaroop2910/taskmanager-frontend:latest
        ports:
        - containerPort: 80
